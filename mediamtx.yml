# mediamtx base config for GoldenEye
# All ports bound to loopback — only GoldenEye is exposed publicly.

api: yes
apiAddress: 127.0.0.1:9997

rtsp: yes
rtspAddress: 127.0.0.1:8554

rtmp: no

hls: yes
hlsAddress: 127.0.0.1:8888
hlsAllowOrigin: "*"
hlsMuxerCloseAfter: 60s

# WebRTC is used for the live preview: it passes the cameras' G711 (pcm_alaw)
# audio through natively, which the HLS muxer cannot do. Signaling (WHEP, HTTP)
# is proxied through GoldenEye on loopback; media flows over UDP directly from
# the browser to this host, so the UDP port must be reachable on the LAN.
webrtc: yes
webrtcAddress: 127.0.0.1:8889
webrtcLocalUDPAddress: :8189
webrtcIPsFromInterfaces: yes
srt: no

logLevel: info
logDestinations: [stdout]

# Paths are managed dynamically by GoldenEye via the mediamtx HTTP API.
# Do not add static paths here.
paths: {}
