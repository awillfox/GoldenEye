<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="color-scheme" content="light dark"/>
  <title>Sign in · GoldenEye</title>
  <link rel="stylesheet" href="/static/app.css"/>
</head>
<body class="min-h-screen grid place-items-center p-4 medium:p-6">

<main class="card w-full max-w-sm p-6 medium:p-8">
  <h1 class="flex items-center justify-center gap-2.5 text-xl font-bold tracking-wide">
    <span class="w-10 h-10 rounded-[10px] bg-primary-cont text-on-primary-cont grid place-items-center">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
    </span>
    GoldenEye
  </h1>
  <p class="text-center text-on-surface-variant mt-1 mb-6">Sign in to view your cameras</p>

  {{if .Error}}
  <div class="banner-error mb-4" role="alert">
    <svg class="icon icon-sm mt-0.5" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/></svg>
    <span>
      {{if eq .Error "invalid credentials"}}Wrong username or password. Try again.
      {{else if eq .Error "server error"}}Something went wrong on the server. Try again in a moment.
      {{else}}Couldn't sign in. Try again.{{end}}
    </span>
  </div>
  {{end}}

  <form method="POST" action="/login" class="flex flex-col gap-4" onsubmit="onSignIn(this)">
    <div class="field">
      <label for="username" class="field-label">Username</label>
      <input id="username" class="input" type="text" name="username" autocomplete="username"
             autocapitalize="none" spellcheck="false" required autofocus/>
    </div>
    <div class="field">
      <label for="password" class="field-label">Password</label>
      <input id="password" class="input" type="password" name="password" autocomplete="current-password" required/>
    </div>
    <button type="submit" class="btn btn-filled w-full min-h-12 mt-2">Sign in</button>
  </form>
</main>

<script>
// Loading state: keep width, show progress, block a double submit.
function onSignIn(form) {
  const btn = form.querySelector('[type=submit]');
  btn.style.minWidth = btn.offsetWidth + 'px';
  btn.setAttribute('aria-busy', 'true');
  btn.innerHTML = '<span class="spinner" aria-hidden="true"></span>Signing in…';
  // Disable after the submit event has captured the form data.
  setTimeout(() => { btn.disabled = true; }, 0);
}
</script>
</body>
</html>
